# PipeWire's built-in SOFA spatializer: stereo music -> two virtual speakers.
# Local proof of concept; select the physical headphone as the playback target.
# The HRTF file is supplied by the system's libmysofa package.
context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "AeroSpatial Stereo Virtual Speakers"
        media.name = "AeroSpatial Stereo Virtual Speakers"
        filter.graph = {
          nodes = [
            { type = sofa name = speaker_left label = spatializer
              config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" gain = 0.5 }
              control = { "Azimuth" = 30.0 "Elevation" = 0.0 "Radius" = 1.0 } }
            { type = sofa name = speaker_right label = spatializer
              config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" gain = 0.5 }
              control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 1.0 } }
            { type = builtin name = mix_left label = mixer }
            { type = builtin name = mix_right label = mixer }
          ]
          links = [
            { output = "speaker_left:Out L" input = "mix_left:In 1" }
            { output = "speaker_right:Out L" input = "mix_left:In 2" }
            { output = "speaker_left:Out R" input = "mix_right:In 1" }
            { output = "speaker_right:Out R" input = "mix_right:In 2" }
          ]
          inputs = [ "speaker_left:In" "speaker_right:In" ]
          outputs = [ "mix_left:Out" "mix_right:Out" ]
        }
        capture.props = {
          node.name = "effect_input.aerospatial_stereo_sofa"
          media.class = Audio/Sink
          audio.channels = 2
          audio.position = [ FL FR ]
        }
        playback.props = {
          node.name = "effect_output.aerospatial_stereo_sofa"
          node.passive = true
          audio.channels = 2
          audio.position = [ FL FR ]
        }
      }
    }
]
